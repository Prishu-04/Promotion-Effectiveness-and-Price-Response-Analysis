[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-rag-copilot"
dynamic = ["version"]
description = "P7-034 Domain RAG Copilot: promotion effectiveness and price-response analysis"
readme = "README.md"
# python 3.13 is left out until the later libraries (chroma etc.) are checked on it
requires-python = ">=3.11,<3.13"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
domain-rag-copilot = "domain_rag_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "domain_rag_copilot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
